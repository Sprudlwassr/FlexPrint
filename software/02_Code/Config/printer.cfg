[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-STMicroelectronics_STM32_STLink_066CFF564987534867093944-if02

[virtual_sdcard]
path: /home/admin/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[stepper_x]
step_pin: PB8
dir_pin: PB9
enable_pin: !PC9
microsteps: 16
rotation_distance: 40
endstop_pin: PC14
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PD2
dir_pin: PC10
enable_pin: !PC11
microsteps: 16
rotation_distance: 40
endstop_pin: PC13
position_endstop: 0
position_max: 200
homing_speed: 50

# first z axis stepper config
[stepper_z]
step_pin: PA8
dir_pin: PC7
enable_pin: !PA7
microsteps: 16
rotation_distance: 8
endstop_pin: PC15
position_endstop: 0.5
position_max: 200

[tmc2209 stepper_z]
uart_pin: PA0
uart_address: 0
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
##############################

# second z axis stepper config
[stepper_z1]
step_pin: PA8
dir_pin: PC7
enable_pin: !PA7
microsteps: 16
rotation_distance: 8
endstop_pin: PC15
position_endstop: 0.5
position_max: 200

[tmc2209 stepper_z1]
uart_pin: PA0
uart_address: 1
run_current: 0.800
hold_current: 0.500
stealthchop_threshold: 999999
##############################

