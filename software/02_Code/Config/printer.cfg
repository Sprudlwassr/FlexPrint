[heater_bed]
heater_pin: PC0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: watermark
min_temp: 0 
max_temp: 130

# [fan]
#pin:

[force_move]
enable_force_move: True

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 1000
max_z_velocity: 25
max_z_accel: 30
